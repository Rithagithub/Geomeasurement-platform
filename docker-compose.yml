version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: geospatial_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geomeasurement_db}
      POSTGRES_USER: ${POSTGRES_USER:-geouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geopassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geouser} -d ${POSTGRES_DB:-geomeasurement_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: geospatial_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-geouser}:${POSTGRES_PASSWORD:-geopassword}@postgres:5432/${POSTGRES_DB:-geomeasurement_db}
      - UPLOAD_DIR=data/uploads
      - PROCESSED_DIR=data/processed
      - MAX_FILE_SIZE_MB=10
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
